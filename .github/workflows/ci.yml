# Continuous integration: runs on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same database image as docker-compose.yml, so migrations are tested for real.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: goalwise
          POSTGRES_PASSWORD: goalwise
          POSTGRES_DB: goalwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goalwise -d goalwise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://goalwise:goalwise@127.0.0.1:5432/goalwise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test with coverage
        run: uv run pytest -v --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
