[project]
name = "goalwise-backend"
version = "0.9.0"
description = "GoalWise backend: FastAPI REST API for goal-based investment planning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "arch>=8.0.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "lightgbm>=4.6",
    "numpy>=2.5.4",
    "pandas>=3.0",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.9",
    "sqlalchemy>=2.0",
    "statsmodels>=0.15",
    "uvicorn[standard]>=0.30",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations contain long SQL literals.
"alembic/versions/*" = ["E501"]
# Verbatim samples of the source files keep their real (long) lines.
"tests/pipeline_samples.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # hmmlearn 0.3.3 sets ndarray.shape, deprecated in NumPy 2.5 (not our code).
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
